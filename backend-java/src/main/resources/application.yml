spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DB:safety_admin}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:change-me}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 520MB

server:
  port: 8081

app:
  jwt:
    # 生产环境必须通过环境变量覆盖
    secret: ${JWT_SECRET:safety-admin-dev-secret-key-please-override-32bytes}
    expire-minutes: 720
  cors:
    allowed-origins: http://127.0.0.1:8000,http://127.0.0.1:8010,http://localhost:5173,http://127.0.0.1:5173
  # 训练任务链：调用算法域的真实训练脚本（Python venv）
  train:
    repo-root: ${TRAIN_REPO_ROOT:..}
    python: ${TRAIN_PYTHON:../.venv/Scripts/python.exe}
    data-yaml: ${TRAIN_DATA_YAML:data/construction_ppe.yaml}
    base-model: ${TRAIN_BASE_MODEL:models/yolov8s.pt}
    epochs: 1
