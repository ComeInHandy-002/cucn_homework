# SPA entry served by nginx; API, media and the legacy workbench are proxied
# to the FastAPI service. nginx takes the public port, the API stays internal
# (compose additionally publishes 8010 for direct debugging).

server {
    listen 80;
    server_name _;

    # Uploads are limited to 100 MB by the API itself; leave headroom here.
    client_max_body_size 200m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 7d;
    }

    location = /api/v1/ws/events {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8000;
    }

    # Annotated media, demo assets and the legacy vanilla workbench.
    location /results/ {
        proxy_pass http://api:8000;
    }
    location /demo/ {
        proxy_pass http://api:8000;
    }
    location /static/ {
        proxy_pass http://api:8000;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
