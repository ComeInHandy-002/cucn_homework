services:
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://safety:safety@db:5432/safety_monitor
      SECRET_KEY: change-this-before-production
      # E7: Expanded PPE + Kaggle PPE with targeted hard-case refinement.
      MODEL_PATH: /app/models/expanded-ppe-yolov8s-hardcase12.pt
      MODEL_IMAGE_SIZE: "640"
      # Keep the container CPU-safe. Add a CUDA base image/runtime before setting this to 0.
      MODEL_DEVICE: ""
      FALLBACK_SCENARIO: compliant
      VIDEO_BATCH_SIZE: "8"
      VIDEO_QUEUE_SIZE: "16"
      VIDEO_DECODE_BACKEND: auto
      VIDEO_ENCODE_BACKEND: auto
      VIDEO_HALF: "true"
      QUEUE_WORKERS: "1"
      MAX_VIDEO_WORKERS: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./uploads:/app/uploads
      - ./results:/app/results
      - ./data:/app/data
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: safety_monitor
      POSTGRES_USER: safety
      POSTGRES_PASSWORD: safety
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
